name: Check new TikTok videos

on:
  schedule:
    # 17:05, 19:35, 20:05, 20:35 y 21:35 en Madrid (CEST, UTC+2).
    # En horario de invierno (CET, UTC+1) se desfasa una hora.
    - cron: "5 15 * * *"
    - cron: "35 17 * * *"
    - cron: "5 18 * * *"
    - cron: "35 18 * * *"
    - cron: "35 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
  TIKTOK_USERNAME: ${{ vars.TIKTOK_USERNAME }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check
        env:
          CHECK_TARGET: tiktok
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_video.json
          git diff --cached --quiet || git commit -m "Actualiza last_video.json (TikTok)"
          git pull --rebase
          git push
