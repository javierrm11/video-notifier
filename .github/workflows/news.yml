name: Daily AI/programming news

on:
  schedule:
    # 10:00 UTC ~= 12:00 en Madrid en horario de verano (CEST).
    # En horario de invierno (CET) equivale a las 11:00, no exactamente
    # mediodía, pero es una aproximación aceptable para un cron fijo en UTC.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Send daily news
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news.py
